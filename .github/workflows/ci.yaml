# yamllint disable rule:line-length
# yamllint disable rule:braces

name: CI

on:
  pull_request:
  push:
    branches:
      - "master"
      - "2.x"
      - "3.x"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: 'PHPUnit (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }})'
    runs-on: "ubuntu-24.04"

    strategy:
      fail-fast: false
      matrix:
        symfony-version:
          - '^8.0'
        php-version:
          - '8.4'
          - '8.5'
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 2

      - name: "Install dependencies with Composer"
        uses: ibexa/gh-workflows/actions/composer-install@main
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "pcov"
          gh-client-id: ${{ secrets.AUTOMATION_CLIENT_ID }}
          gh-client-secret: ${{ secrets.AUTOMATION_CLIENT_SECRET }}
          satis-network-key: ${{ secrets.SATIS_NETWORK_KEY }}
          satis-network-token: ${{ secrets.SATIS_NETWORK_TOKEN }}
          composer-options: "--with symfony/framework-bundle:${{ matrix.symfony-version }}"
        env:
          COMPOSER_FUND: '0'

      - name: Run tests
        run: |
          SYMFONY_PHPUNIT_VERSION=11.5 SYMFONY_DEPRECATIONS_HELPER='max[direct]=0&verbose=1&quiet[]=indirect' vendor/bin/simple-phpunit ${PHPUNIT_FLAGS}

  phpstan:
    name: 'PHPStan (PHP ${{ matrix.php }})'
    runs-on: "ubuntu-26.04"

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'

    steps:
      - uses: actions/checkout@v7

      - name: Install Composer dependencies
        uses: ibexa/gh-workflows/actions/composer-install@main
        with:
          php-version: "${{ matrix.php }}"
          gh-client-id: ${{ secrets.AUTOMATION_CLIENT_ID }}
          gh-client-secret: ${{ secrets.AUTOMATION_CLIENT_SECRET }}
          satis-network-key: ${{ secrets.SATIS_NETWORK_KEY }}
          satis-network-token: ${{ secrets.SATIS_NETWORK_TOKEN }}
          composer-options: "--prefer-dist --no-progress --with symfony/framework-bundle:^8.0"
        env:
          COMPOSER_FUND: '0'

      - name: Run PHPStan analysis
        run: composer run-script phpstan
