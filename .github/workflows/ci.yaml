# yamllint disable rule:line-length
# yamllint disable rule:braces

name: CI

on:
  pull_request:
  push:
    branches:
      - "master"
      - "2.x"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: 'PHPUnit (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }} + ${{ matrix.dependencies }} deps)'
    runs-on: "ubuntu-24.04"

    strategy:
      fail-fast: false
      matrix:
        symfony-version:
          - '^7.2'
        php-version:
          - '8.3'
          - '8.4'
        dependencies:
          - 'lowest'
          - 'highest'
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"
        with:
          fetch-depth: 2

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "pcov"
          tools: 'flex'
          ini-values: "zend.assertions=1"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "${{ matrix.dependencies }}"
          composer-options: "${{ matrix.composer-options }}"
        env:
          COMPOSER_FUND: '0'
          SYMFONY_REQUIRE: '${{ matrix.symfony-version }}'

      - name: Run tests
        run: |
          SYMFONY_PHPUNIT_VERSION=11.5 SYMFONY_DEPRECATIONS_HELPER=weak vendor/bin/simple-phpunit ${PHPUNIT_FLAGS}

  phpstan:
    name: 'PHPStan (PHP ${{ matrix.php }})'
    runs-on: "ubuntu-26.04"

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'

    steps:
      - uses: actions/checkout@v7

      # Pre-installs the symfony/flex global plugin so the SYMFONY_REQUIRE env
      # below constrains the whole Symfony component family during the composer
      # install that follows, not just the packages this bundle requires
      # directly - otherwise transitive components (e.g. symfony/dependency-injection
      # via symfony/framework-bundle) can resolve to a newer major on PHP 8.4.
      - name: "Install PHP with Symfony Flex"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php }}"
          coverage: "none"
          tools: 'flex'

      - name: Install Composer dependencies
        uses: ibexa/gh-workflows/actions/composer-install@main
        with:
          gh-client-id: ${{ secrets.AUTOMATION_CLIENT_ID }}
          gh-client-secret: ${{ secrets.AUTOMATION_CLIENT_SECRET }}
          satis-network-key: ${{ secrets.SATIS_NETWORK_KEY }}
          satis-network-token: ${{ secrets.SATIS_NETWORK_TOKEN }}
          composer-options: "--prefer-dist --no-progress --no-suggest"
        env:
          COMPOSER_FUND: '0'
          SYMFONY_REQUIRE: '^7.2'

      - name: Run PHPStan analysis
        run: composer run-script phpstan
